<!DOCTYPE html>

<html>


<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ChatGPT</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div id="loginPage">

<img
src="images/logo.png"
class="logo">

<h2>ChatGPT</h2>

<input
type="password"
id="apiKey"
placeholder="OpenAI API Key">

<button id="loginBtn">

LOGIN

</button>

<div id="loginStatus"></div>

</div>

<div id="chatPage">

<div id="header">

ChatGPT

</div>

<div id="messages">

</div>

<div id="typing">

Thinking...

</div>

<div id="bottom">

<input
id="question"
type="text"
placeholder="Ask...">

<button id="mic">

🎤

</button>

<button id="send">

➤

</button>

</div>

</div>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
